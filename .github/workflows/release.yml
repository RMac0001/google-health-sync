name: Release

# Push a tag matching the manifest version (e.g. "0.1.0", no "v" prefix)
# to build the plugin and create a draft GitHub release.
on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run build
            - name: Verify tag matches manifest version
              run: |
                  manifest_version=$(node -p "require('./manifest.json').version")
                  if [ "$manifest_version" != "$GITHUB_REF_NAME" ]; then
                    echo "Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
                    exit 1
                  fi
            - name: Create draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                    --title "$GITHUB_REF_NAME" \
                    --draft \
                    main.js manifest.json styles.css
